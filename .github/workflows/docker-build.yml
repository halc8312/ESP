name: Docker Build Validation

on:
  push:
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'
      - 'render.yaml'
      - 'render.existing-web-addons.yaml'
      - '*.py'
      - 'alembic/**'
      - 'config/**'
      - 'jobs/**'
      - 'routes/**'
      - 'services/**'
      - 'static/**'
      - 'templates/**'
      - 'utils/**'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - '.dockerignore'
      - '.github/workflows/docker-build.yml'
      - 'render.yaml'
      - 'render.existing-web-addons.yaml'
      - '*.py'
      - 'alembic/**'
      - 'config/**'
      - 'jobs/**'
      - 'routes/**'
      - 'services/**'
      - 'static/**'
      - 'templates/**'
      - 'utils/**'

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Measure build context size
        run: |
          echo "=== Build context size (total repo without .git) ==="
          du -sh --exclude='.git' .
          echo ""
          echo "=== Largest files in context ==="
          find . -not -path './.git/*' -type f -exec du -h {} + | sort -rh | head -15

      - name: Seed harmless build-context exclusion fixtures
        run: |
          python - <<'PY'
          from pathlib import Path
          for directory in (Path('.'), Path('context-smoke/nested')):
              directory.mkdir(parents=True, exist_ok=True)
              names = ['.env', '.env.production']
              names += [f'context-smoke.{extension}{suffix}'
                        for extension in ('db', 'sqlite', 'sqlite3')
                        for suffix in ('', '-wal', '-shm', '-journal')]
              for name in names:
                  with (directory / name).open('x') as fixture:
                      fixture.write('harmless build-context exclusion sentinel\n')
          PY

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: esp-test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Report image size
        run: |
          echo "=== Docker image size ==="
          docker images esp-test:ci --format "{{.Size}}"
          echo ""
          echo "=== Image layer details ==="
          docker history esp-test:ci --no-trunc --format "table {{.Size}}\t{{.CreatedBy}}" | head -20

      - name: Smoke test - Local environment and database files excluded
        run: |
          docker run --rm --network none esp-test:ci python -c "
          from pathlib import Path
          for directory in (Path('/app'), Path('/app/context-smoke/nested')):
              names = ['.env', '.env.production']
              names += [f'context-smoke.{extension}{suffix}'
                        for extension in ('db', 'sqlite', 'sqlite3')
                        for suffix in ('', '-wal', '-shm', '-journal')]
              for name in names:
                  assert not (directory / name).exists(), f'Unexpected build-context file: {name}'
          print('Root and nested environment/database files excluded')
          "

      - name: Smoke test - Python imports
        run: |
          docker run --rm esp-test:ci python -c "
          import flask; print('flask OK')
          import scrapling; print('scrapling OK')
          import playwright; print('playwright OK')
          import patchright; print('patchright OK')
          print('All critical imports OK')
          "

      - name: Smoke test - Background removal without network
        timeout-minutes: 3
        run: |
          docker run --rm --network none -e OMP_NUM_THREADS=1 esp-test:ci python -c "
          import io
          from PIL import Image, ImageDraw
          from services.bg_remover.rembg_backend import RembgBackgroundRemover
          source = Image.new('RGB', (96, 96), 'white')
          ImageDraw.Draw(source).rectangle((24, 24, 72, 72), fill='red')
          payload = io.BytesIO()
          source.save(payload, format='PNG')
          remover = RembgBackgroundRemover(model_name='u2netp', max_input_dimension=64)
          result = remover.remove_background(payload.getvalue())
          assert isinstance(result, bytes)
          with Image.open(io.BytesIO(result)) as output:
              output.load()
              assert output.format == 'PNG'
              assert output.mode == 'RGBA'
              assert output.size == (64, 64)
          print('Background removal with baked CPU model OK')
          "

      - name: Smoke test - Patchright persistent Chrome under Xvfb
        timeout-minutes: 3
        run: |
          docker run --rm -e RECORDCITY_BROWSER_PROFILE=persistent-chrome esp-test:ci \
          timeout 90s tini -- python -c "
          import asyncio
          import os
          import tempfile
          from pathlib import Path
          from patchright.async_api import async_playwright
          from services.recordcity_virtual_display import recordcity_virtual_display
          async def smoke():
              print('Starting Patchright persistent Chrome/Xvfb', flush=True)
              with recordcity_virtual_display():
                  assert os.environ.get('DISPLAY')
                  async with async_playwright() as driver:
                      profile_dir = tempfile.mkdtemp(prefix='recordcity-chrome-smoke-')
                      browser = await driver.chromium.launch_persistent_context(
                          user_data_dir=profile_dir,
                          channel='chrome',
                          headless=False,
                          no_viewport=True,
                          args=[],
                      )
                      try:
                          page = await browser.new_page()
                          await page.goto('about:blank')
                          assert 'HeadlessChrome' not in await page.evaluate('navigator.userAgent')
                          assert await page.evaluate('navigator.webdriver') is False
                          cmdlines = []
                          for path in Path('/proc').glob('[0-9]*/cmdline'):
                              try:
                                  cmdlines.append(path.read_bytes().replace(b'\0', b' ').decode(errors='ignore'))
                              except (OSError, PermissionError):
                                  pass
                          assert any('/opt/google/chrome/' in command for command in cmdlines)
                      finally:
                          await browser.close()
              print('Patchright persistent Chrome/Xvfb OK', flush=True)
          asyncio.run(smoke())
          "

      - name: Smoke test - Worker wrapper forwards SIGTERM
        timeout-minutes: 2
        run: |
          set -euo pipefail
          container_id=$(docker run -d \
            -e RECORDCITY_BROWSER_PROFILE=persistent-chrome \
            esp-test:ci tini -- python -c "
          import signal
          import time
          from services.recordcity_virtual_display import recordcity_virtual_display

          stopping = False

          def stop(_signum, _frame):
              global stopping
              stopping = True
              print('Worker child received SIGTERM', flush=True)

          signal.signal(signal.SIGTERM, stop)
          with recordcity_virtual_display():
              print('Worker child ready', flush=True)
              while not stopping:
                  time.sleep(0.1)
              print('Worker child draining', flush=True)
              time.sleep(1)
          print('Worker child cleanup completed', flush=True)
          ")
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          ready=0
          for _ in $(seq 1 20); do
            container_logs=$(docker logs "$container_id" 2>&1)
            if grep -Fq 'Worker child ready' <<<"$container_logs"; then
              ready=1
              break
            fi
            sleep 0.5
          done
          test "$ready" -eq 1
          docker stop --time 15 "$container_id" >/dev/null
          container_logs=$(docker logs "$container_id" 2>&1)
          grep -Fq 'Worker child received SIGTERM' <<<"$container_logs"
          grep -Fq 'Worker child cleanup completed' <<<"$container_logs"
          test "$(docker inspect -f '{{.State.ExitCode}}' "$container_id")" -eq 0
